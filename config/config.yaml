# Sentinel-Lite Event Processing Configuration (ADR-003: Redis Unified Messaging)
redis:
  url: redis://localhost:6379/0
  channels:
    events: sentinel:events               # Pub/Sub channel for realtime fanout & WebSocket bridge
  queues:
    raw_processing: sentinel:queue        # List queue for background worker processing
    dead_letter: sentinel:queue:dlq       # Dead-letter queue for failed processing

correlation:
  window_seconds: 30                      # sliding window per zone
  loitering_motion_threshold: 3
  loitering_window_seconds: 60
  tailgate_line_crossing_threshold: 2
  tailgate_window_seconds: 8
  motion_correlation_camera_threshold: 2  # distinct cameras within window for multi-camera correlation
  cross_dept_threshold: 2                 # distinct departments for cross-dept plate alert
  confidence_boost_per_event: 0.1
  max_confidence: 1.0

processing:
  prefetch_count: 10
  max_retries: 3
  retry_backoff_seconds: 2
