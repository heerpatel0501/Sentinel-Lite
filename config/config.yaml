rabbitmq:
  host: localhost
  port: 5672
  vhost: "/"
  user: sentinel
  password: sentinel_pw
  heartbeat: 30
  connection_attempts: 5
  retry_delay_seconds: 3

exchanges:
  raw_events: sentinel.raw_events
  processed_events: sentinel.processed_events
  dead_letter: sentinel.raw_events.dlx

queues:
  raw_processing: event_processing.raw
  dead_letter: event_processing.dlq
  dashboard: dashboard.processed
  ai_analytics: ai_analytics.processed

correlation:
  window_seconds: 30          # sliding window per zone
  loitering_motion_threshold: 3
  loitering_window_seconds: 60
  tailgate_line_crossing_threshold: 2
  tailgate_window_seconds: 8
  confidence_boost_per_event: 0.1
  max_confidence: 1.0

processing:
  prefetch_count: 10
  max_retries: 3
  retry_backoff_seconds: 2
