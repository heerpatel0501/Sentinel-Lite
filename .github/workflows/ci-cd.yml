name: Sentinel-Lite CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  AWS_REGION: 'ap-south-1'

jobs:
  # ==========================================================================
  # Stage 1: Lint & Static Analysis
  # ==========================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt || pip install fastapi uvicorn sqlalchemy python-dotenv pyjwt requests python-multipart
          pip install ruff mypy

      - name: Ruff lint (backend)
        run: |
          cd backend
          ruff check . --select E,W,F --ignore E501 || true

      - name: Type check (optional, non-blocking)
        run: |
          cd backend
          mypy main.py --ignore-missing-imports --no-error-summary || true

  # ==========================================================================
  # Stage 2: Backend Unit & Integration Tests
  # ==========================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt || pip install fastapi uvicorn sqlalchemy python-dotenv pyjwt requests python-multipart
          pip install httpx pytest pytest-asyncio

      - name: Start backend server
        run: |
          cd backend
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run E2E pipeline tests
        run: python test_e2e_pipeline.py

      - name: Run Phase 11 verification
        run: python test_phase11.py

      - name: Health check
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/ready || exit 1
          curl -f http://localhost:8000/metrics || exit 1

  # ==========================================================================
  # Stage 3: Frontend Build Validation
  # ==========================================================================
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

      - name: Verify build output
        run: |
          test -d frontend/dist || test -d frontend/build

  # ==========================================================================
  # Stage 4: Docker Build & Push
  # ==========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sentinel-lite-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/sentinel-lite-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Stage 5: Deploy to ECS
  # ==========================================================================
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws/ecs-task-definition.json
          container-name: sentinel-backend
          image: ${{ steps.login-ecr.outputs.registry }}/sentinel-lite-backend:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: sentinel-lite-service
          cluster: sentinel-lite-cluster
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Smoke test production
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -n "$PROD_URL" ]; then
            curl -f "$PROD_URL/health" || echo "Warning: Production health check failed"
            curl -f "$PROD_URL/ready" || echo "Warning: Production readiness check failed"
          fi
