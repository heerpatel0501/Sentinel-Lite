
# Sentinel Lite

Sentinel Lite is a security monitoring and event-processing project.

## Project Components

The repository contains the main Sentinel Lite application along with the Event Processing and Correlation service.

### Main Application

- Backend
- Frontend
- PostgreSQL/PostGIS
- Redis
- MediaMTX

### Member 3 — Event Processing + Correlation

The Member 3 service processes raw security events through RabbitMQ.

Flow:

Raw Events
→ RabbitMQ
→ Event Processing
→ Normalization
→ Correlation Engine
→ Processed Events

