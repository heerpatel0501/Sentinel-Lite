version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sentinel_db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  backend:
    build: ./backend
    container_name: sentinel_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@db:5432/sentinel_db
      RELAY_INTERNAL_URL: http://mediamtx:8888
      RELAY_PUBLIC_URL: http://localhost:8888
    restart: always

  frontend:
    build: ./frontend
    container_name: sentinel_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: sentinel_mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
    restart: always

volumes:
  postgres_data:
